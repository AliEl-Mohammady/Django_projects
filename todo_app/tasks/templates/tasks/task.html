{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
    <link rel="stylesheet" href="{% static 'css/task.css' %}">
</head>
<body>
    <div class="container">
        <h1 class="title">📝 To-Do List</h1>

        <!-- Form: Add Task -->
        <form method="POST" action="/" class="task-form">
            {% csrf_token %}
            {{ form.title }}
            <button type="submit" class="btn add">➕ Add Task</button>
        </form>

        <!-- Tasks Display -->
        <div class="task-list">
            {% for task in tasks %}
                <div class="task-card {% if task.completed %}completed{% endif %}">
                    <div class="task-info">
                        <form method="POST" action="{% url 'toggle_task' task.id %}">
                            {% csrf_token %}
                            <label class="checkbox-label">
                                <input type="checkbox" name="completed" onchange="this.form.submit()" {% if task.completed %}checked{% endif %}>
                                <span class="task-title">
                                    {% if task.completed %}
                                        <strike>{{ task.title }}</strike>
                                    {% else %}
                                        {{ task.title }}
                                    {% endif %}
                                </span>
                            </label>
                        </form>
                        <p class="task-meta">🕒 Created: {{ task.creeated }}</p>
                    </div>
                    <div class="task-actions">
                        <a href="/update/{{ task.id }}"><button class="btn update">✏️ Update</button></a>
                        <a href="/delete/{{ task.id }}"><button class="btn delete">🗑️ Delete</button></a>
                    </div>
                </div>
            {% empty %}
                <p class="empty">No tasks available. Add one above!</p>
            {% endfor %}
        </div>
        
        
</body>
</html>
